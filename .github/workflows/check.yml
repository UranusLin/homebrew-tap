name: Tap checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify actual published asset
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          python3 scripts/update_formula.py --version "$VERSION" --check
      - name: Install this checkout and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap UranusLin/tap "$GITHUB_WORKSPACE"
          if brew commands | grep -qx trust; then
            brew trust --formula UranusLin/tap/runloom
          fi
          brew install --build-from-source UranusLin/tap/runloom
          brew test UranusLin/tap/runloom
